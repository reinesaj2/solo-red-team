version: "3.9"

services:
  web-basic:
    image: httpd:2.4
    container_name: lab_web_basic
    volumes:
      - ./targets/basic:/usr/local/apache2/htdocs/:ro
    ports:
      - "8081:80"
    networks:
      - lab_net

  web-digest:
    image: httpd:2.4
    container_name: lab_web_digest
    volumes:
      - ./targets/digest:/usr/local/apache2/htdocs/:ro
    ports:
      - "8082:80"
    networks:
      - lab_net

  web-form:
    image: nginx:1.27-alpine
    container_name: lab_web_form
    volumes:
      - ./targets/html:/usr/share/nginx/html:ro
    ports:
      - "8083:80"
    networks:
      - lab_net

networks:
  lab_net:
    driver: bridge


